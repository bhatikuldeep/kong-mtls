# The gateway configuration, synced to the Konnect control plane by kongctl (which runs decK).
# The CA certificate and the gateway's server certificate are in kong/certs.yaml, generated by scripts/certs.sh.
_format_version: "3.0"
_info:
  select_tags: [mtls-identity]

# Three rate limit tiers. A tier is a consumer group; its plugins apply to every consumer in it.
consumer_groups:
  - name: gold
    plugins:
      - name: rate-limiting-advanced
        config:
          identifier: consumer        # each client gets its own counter
          limit: [10]
          window_size: [60]
          namespace: tier-gold        # pinned, so decK shows no drift
          strategy: local
          window_type: fixed          # counters reset each minute (the default, sliding, also weighs the previous minute)
  - name: silver
    plugins:
      - name: rate-limiting-advanced
        config:
          identifier: consumer
          limit: [5]
          window_size: [60]
          namespace: tier-silver
          strategy: local
          window_type: fixed
  - name: bronze
    plugins:
      - name: rate-limiting-advanced
        config:
          identifier: consumer
          limit: [3]
          window_size: [60]
          namespace: tier-bronze
          strategy: local
          window_type: fixed

# One consumer per client, each in one tier. The mtls-auth credential maps the certificate's SAN (or CN) to the consumer.
consumers:
  - username: client-a
    custom_id: app-1001             # your own ID for the client, passed to the upstream
    groups:
      - name: gold
    mtls_auth_credentials:
      - id: 5b1e0c62-6f0a-4c39-9a11-0000000000a1   # decK needs a fixed ID for this credential
        subject_name: client-a.example.test
        ca_certificate: { id: 5b1e0c62-6f0a-4c39-9a11-000000000001 }   # only certificates from this CA match
  - username: client-b
    custom_id: app-1002
    groups:
      - name: silver
    mtls_auth_credentials:
      - id: 5b1e0c62-6f0a-4c39-9a11-0000000000b1
        subject_name: client-b.example.test
        ca_certificate: { id: 5b1e0c62-6f0a-4c39-9a11-000000000001 }
  - username: client-c
    custom_id: app-1003
    groups:
      - name: bronze
    mtls_auth_credentials:
      - id: 5b1e0c62-6f0a-4c39-9a11-0000000000c1
        subject_name: client-c.example.test
        ca_certificate: { id: 5b1e0c62-6f0a-4c39-9a11-000000000001 }

services:
  - name: orders-api
    url: http://orders:8080/anything   # the echo upstream in compose.yaml
    plugins:
      # Every request needs a client certificate from the client CA that maps to a consumer
      - name: mtls-auth
        config:
          ca_certificates:
            - 5b1e0c62-6f0a-4c39-9a11-000000000001
          # TLS verification of the CRL and OCSP endpoints. Konnect stores false if this is left out, and a
          # 3.14+ data plane (tls_certificate_verify = on) then rejects the whole configuration
          ssl_verify: true
          # Match by credential only. The default (username, custom_id) would also accept any trusted
          # certificate whose name equals a consumer's username or custom_id, bypassing the ca_certificate pin.
          consumer_by: []
          # This demo CA publishes no CRL or OCSP responder. With your real CA, use STRICT if it does.
          revocation_check_mode: SKIP
    routes:
      - name: orders
        protocols: [https]
        snis: [api.example.test]        # Kong asks for a client certificate only on this SNI (if every mtls-auth route has snis)
        paths: [/orders]
      - name: reports
        protocols: [https]
        snis: [api.example.test]
        paths: [/reports]
        plugins:
          # Gold tier only
          - name: acl
            config:
              allow: [gold]
              include_consumer_groups: true

  # Part 2: Kong presents its own client certificate to a backend that only accepts mTLS
  - name: inventory-api
    url: https://inventory:8443
    client_certificate: 5b1e0c62-6f0a-4c39-9a11-000000000004   # the certificate Kong presents
    tls_verify: true                                     # check the backend's certificate...
    ca_certificates: [5b1e0c62-6f0a-4c39-9a11-000000000003]   # ...against the backend CA
    routes:
      - name: inventory
        protocols: [https]
        snis: [api.example.test]
        paths: [/inventory]
      # Bonus: this route also authenticates the client (Part 1), so the backend learns who called
      - name: inventory-whoami
        protocols: [https]
        snis: [api.example.test]
        paths: [/inventory/whoami]
        plugins:
          - name: mtls-auth
            config:
              ca_certificates:
                - 5b1e0c62-6f0a-4c39-9a11-000000000001
              ssl_verify: true
              consumer_by: []
              revocation_check_mode: SKIP
