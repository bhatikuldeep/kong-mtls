# Part 2 backend: accepts only callers with a certificate from the backend CA, and returns what it learned
# about the caller: the client certificate's subject, and the consumer header if Kong sent one.
server {
  listen 8443 ssl;
  server_name inventory;
  ssl_certificate        /certs/inventory.crt;
  ssl_certificate_key    /certs/inventory.key;
  ssl_client_certificate /certs/backend-ca.crt;
  ssl_verify_client      on;

  location / {
    default_type application/json;
    return 200 '{"client_certificate":"$ssl_client_s_dn","consumer":"$http_x_consumer_username"}\n';
  }
}
