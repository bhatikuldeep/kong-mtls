# Bonus: stands in for a CDN or WAF that ends TLS in front of Kong. It checks the client certificate,
# then passes it to Kong in a header, the way a CDN with client certificate forwarding does.

# Forward the certificate only when this edge verified it. Anything else sends no header at all.
map $ssl_client_verify $client_cert {
  SUCCESS $ssl_client_escaped_cert;   # the PEM certificate, URL-encoded
  default "";
}

server {
  listen 8443 ssl;
  server_name edge.example.test;
  ssl_certificate        /certs/edge.crt;
  ssl_certificate_key    /certs/edge.key;
  ssl_client_certificate /certs/client-ca.crt;   # the edge trusts the same client CA as Kong
  ssl_verify_client      optional;               # no certificate: pass on with no header; a bad one: 400 here

  location / {
    proxy_pass https://kong:8443;
    proxy_ssl_server_name on;
    proxy_ssl_name api.example.test;
    proxy_ssl_verify on;                         # the edge checks Kong's certificate too
    proxy_ssl_trusted_certificate /certs/gateway-ca.crt;
    proxy_set_header Host api.example.test;
    # proxy_set_header replaces whatever the client sent in these headers, so a client can't forge them
    proxy_set_header X-Client-Cert $client_cert;
    proxy_set_header X-Origin-Verify "demo-origin-secret";   # a demo value: use a long random secret, rotated
  }
}
